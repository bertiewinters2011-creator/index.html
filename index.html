<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRILLION: Endless Dive</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #031529;
            color: #e0f7fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        #ocean-arena {
            position: relative;
            width: 100%;
            max-width: 540px;
            min-height: 590px;
            border-radius: 22px;
            border: 2px solid #00e5ff;
            background: linear-gradient(180deg, #094074 0%, #042242 40%, #010c1c 80%, #000205 100%);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(0, 229, 255, 0.25);
            border: 1px solid rgba(0, 229, 255, 0.45);
            border-radius: 50%;
            pointer-events: none;
            animation: rise linear infinite;
            z-index: 1;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-640px) scale(1.4); opacity: 0; }
        }
        .depth-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 75px 14px 20px 14px;
            opacity: 0.22;
            font-size: 0.7rem;
            font-weight: bold;
            color: #4dd0e1;
        }
        .depth-line { border-bottom: 1px dashed #00e5ff; text-align: right; padding-bottom: 2px; }
        .hud-top { position: relative; z-index: 10; text-align: center; }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 4px; color: #00e5ff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.7); }
        .stats-row {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 12, 28, 0.78);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        #timer-track {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            margin-top: 10px;
            overflow: hidden;
        }
        #timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00e676, #00e5ff);
            transition: width 0.1s linear;
        }
        #swim-stage { position: relative; z-index: 8; height: 125px; width: 100%; margin: 6px 0; }
        #krill-swimmer {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.6rem;
            filter: drop-shadow(0 0 16px #00e5ff);
            transition: top 1.1s cubic-bezier(0.22, 1, 0.36, 1);
            user-select: none;
        }
        .krill-idle { animation: floatIdle 2.2s ease-in-out infinite; }
        @keyframes floatIdle {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(-4deg); }
            50% { transform: translateX(-50%) translateY(-8px) rotate(4deg); }
        }
        .krill-burst { animation: diveBurst 0.5s ease-in-out 2; }
        @keyframes diveBurst {
            0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); }
            30% { transform: translateX(-70%) scale(1.3) rotate(-22deg); }
            70% { transform: translateX(-30%) scale(1.3) rotate(22deg); }
        }
        #depth-popup {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 1.2rem;
            color: #00e676;
            text-shadow: 0 0 10px #000;
            opacity: 0;
            pointer-events: none;
        }
        .pop-anim { animation: floatUp 1.2s ease-out forwards; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -35px); }
        }
        .interaction-card {
            position: relative;
            z-index: 10;
            background: rgba(2, 15, 32, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 16px;
            padding: 18px;
        }
        #prompt-text {
            font-size: 1.18rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 14px;
            line-height: 1.35;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #00838f;
            background: #010a17;
            color: #fff;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }
        input[type="text"]:focus { border-color: #00e5ff; }
        .shake { animation: shakeAnim 0.35s ease; border-color: #ff5252 !important; }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        #feedback-msg {
            color: #ff5252;
            font-size: 0.88rem;
            font-weight: 700;
            margin-top: 8px;
            min-height: 18px;
            text-align: center;
        }
        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #00e5ff;
            color: #010a17;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { transform: scale(0.96); }
        #reveal-box { display: none; text-align: left; }
        .tier-pill {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .hints-text {
            font-size: 0.84rem;
            color: #b2ebf2;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.12);
            line-height: 1.4;
        }
        #results-screen {
            display: none;
            position: relative;
            z-index: 10;
            background: rgba(2, 15, 32, 0.94);
            border: 1px
